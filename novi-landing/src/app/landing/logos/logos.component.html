<section class="border-y border-line-soft py-14">
  <p class="text-center font-mono text-xs font-medium uppercase tracking-[0.2em] text-dim">
    Powering 4,000+ product teams
  </p>
  <div
    class="marquee mx-auto mt-8 max-w-5xl overflow-hidden [mask-image:linear-gradient(to_right,transparent,black_10%,black_90%,transparent)]"
  >
    <div class="marquee-track flex w-max items-center">
      <div class="flex items-center gap-14 pr-14">
        <span *ngFor="let item of logos" [class]="item.class" class="whitespace-nowrap text-muted/70 transition-colors hover:text-fg">{{ item.name }}</span>
      </div>
      <div class="flex items-center gap-14 pr-14" aria-hidden="true">
        <span *ngFor="let item of logos" [class]="item.class" class="whitespace-nowrap text-muted/70 transition-colors hover:text-fg">{{ item.name }}</span>
      </div>
    </div>
  </div>
</section>
