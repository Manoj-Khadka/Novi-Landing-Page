<section id="faq" class="relative py-24 md:py-32">
  <div class="container-nv max-w-3xl">
    <div class="reveal text-center">
      <p class="section-eyebrow">FAQ</p>
      <h2 class="mt-4 text-4xl font-bold tracking-[-0.02em] text-fg md:text-5xl">
        Questions, answered
      </h2>
    </div>

    <div class="mt-12 space-y-3">
      <div
        *ngFor="let item of items; index as i"
        class="card-line overflow-hidden transition-colors"
        [class.border-accent/40]="openIndex() === i"
      >
        <button
          class="flex w-full items-center justify-between gap-4 px-6 py-5 text-left"
          (click)="toggle(i)"
          [attr.aria-expanded]="openIndex() === i"
        >
          <span class="text-[15px] font-medium text-fg">{{ item.q }}</span>
          <lucide-angular
            [name]="ChevronDown"
            [size]="18"
            [strokeWidth]="2"
            class="shrink-0 text-muted transition-transform duration-300"
            [class.rotate-180]="openIndex() === i"
          />
        </button>
        <div
          class="grid transition-[grid-template-rows] duration-300 ease-out"
          [class.grid-rows-[1fr]]="openIndex() === i"
          [class.grid-rows-[0fr]]="openIndex() !== i"
        >
          <div class="overflow-hidden">
            <p class="px-6 pb-5 text-[15px] leading-relaxed text-muted">{{ item.a }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
