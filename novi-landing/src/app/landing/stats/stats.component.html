<section id="stats" class="relative py-16">
  <div class="container-nv">
    <div class="reveal card-line relative overflow-hidden px-8 py-16 md:px-12">
      <div class="pointer-events-none absolute inset-0" aria-hidden="true">
        <div class="grid-bg absolute inset-0 opacity-30"></div>
        <div class="absolute -right-20 -top-24 h-64 w-64 rounded-full bg-accent/15 blur-[90px]"></div>
        <div class="absolute -bottom-24 -left-20 h-64 w-64 rounded-full bg-accent-cyan/10 blur-[90px]"></div>
      </div>

      <div class="relative grid grid-cols-2 gap-x-8 gap-y-12 lg:grid-cols-4 lg:gap-x-6">
        <div *ngFor="let stat of stats" class="text-center lg:text-left">
          <p class="text-4xl font-bold tracking-tight md:text-5xl">
            <span
              class="stat-num text-gradient"
              [attr.data-target]="stat.target"
              [attr.data-decimals]="stat.decimals"
              >0</span
            ><span class="text-gradient">{{ stat.suffix }}</span>
          </p>
          <p class="mt-2 text-sm text-muted">{{ stat.label }}</p>
        </div>
      </div>
    </div>
  </div>
</section>
