<header
  class="fixed inset-x-0 top-0 z-50 transition-all duration-300"
  [class.glass]="scrolled()"
  [class.border-b]="scrolled()"
  [class.border-line]="scrolled()"
>
  <nav class="container-nv flex h-16 items-center justify-between">
    <a href="#" class="flex items-center gap-2.5" (click)="close()">
      <span
        class="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-accent to-accent-cyan font-mono text-sm font-bold text-white shadow-[0_0_20px_-4px_rgba(139,92,246,0.8)]"
        >N</span
      >
      <span class="text-[17px] font-semibold tracking-tight text-fg">novi</span>
    </a>

    <div class="hidden flex-1 items-center justify-center gap-1 md:flex">
      <a
        *ngFor="let link of links"
        [href]="link.href"
        class="link-underline link-underline--inset rounded-full px-3.5 py-2 text-sm text-muted transition-colors hover:bg-white/5 hover:text-fg"
        >{{ link.label }}</a
      >
    </div>

    <div class="hidden md:block">
      <a href="#pricing" class="btn-primary px-5 py-2.5 text-sm">
        Start Free
        <lucide-angular [name]="ArrowRight" [size]="15" [strokeWidth]="2" />
      </a>
    </div>

    <button
      class="grid h-10 w-10 place-items-center rounded-lg border border-line bg-panel text-fg md:hidden"
      (click)="toggle()"
      aria-label="Open menu"
    >
      <lucide-angular [name]="Menu" [size]="20" />
    </button>
  </nav>
</header>

<div
  class="fixed inset-0 z-[60] md:hidden"
  [class.pointer-events-none]="!open()"
>
  <div
    class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity duration-300"
    [class.opacity-100]="open()"
    [class.opacity-0]="!open()"
    (click)="close()"
    aria-hidden="true"
  ></div>

  <aside
    class="absolute right-0 top-0 flex h-full w-[300px] max-w-[85vw] flex-col border-l border-line bg-base shadow-2xl transition-transform duration-300 ease-out"
    [class.translate-x-0]="open()"
    [class.translate-x-full]="!open()"
    aria-label="Mobile menu"
  >
    <div class="flex items-center justify-between border-b border-line-soft px-6 py-4">
      <a href="#" class="flex items-center gap-2.5" (click)="close()">
        <span
          class="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-accent to-accent-cyan font-mono text-sm font-bold text-white"
          >N</span
        >
        <span class="text-[17px] font-semibold tracking-tight text-fg">novi</span>
      </a>
      <button
        class="grid h-9 w-9 place-items-center rounded-lg border border-line bg-panel text-fg"
        (click)="close()"
        aria-label="Close menu"
      >
        <lucide-angular [name]="X" [size]="18" />
      </button>
    </div>

    <nav class="flex flex-1 flex-col gap-1 overflow-y-auto px-3 py-4">
      <a
        *ngFor="let link of links"
        [href]="link.href"
        (click)="close()"
        class="flex items-center justify-between rounded-xl px-4 py-3 text-[15px] font-medium text-muted transition-colors hover:bg-white/5 hover:text-fg"
      >
        {{ link.label }}
        <lucide-angular [name]="ArrowRight" [size]="16" [strokeWidth]="1.75" class="text-dim" />
      </a>
    </nav>

    <div class="border-t border-line-soft p-4">
      <a href="#pricing" (click)="close()" class="btn-primary w-full px-5 py-3">
        Start Free
        <lucide-angular [name]="ArrowRight" [size]="15" [strokeWidth]="2" />
      </a>
      <p class="mt-3 text-center text-[12px] text-dim">Free for teams up to 10</p>
    </div>
  </aside>
</div>
