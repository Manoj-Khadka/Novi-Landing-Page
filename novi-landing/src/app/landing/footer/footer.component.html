<footer class="border-t border-line-soft">
  <div class="container-nv py-16">
    <div class="grid gap-12 lg:grid-cols-[1.3fr_repeat(3,1fr)_1.4fr]">
      <div>
        <a href="#" class="flex items-center gap-2.5">
          <span
            class="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-accent to-accent-deep font-mono text-sm font-bold text-white"
            >N</span
          >
          <span class="text-[17px] font-semibold tracking-tight text-fg">NOVI</span>
        </a>
        <p class="mt-4 max-w-xs text-sm leading-relaxed text-muted">
          The calm workspace for modern teams.
        </p>
      </div>

      <div *ngFor="let col of columns">
        <p class="font-mono text-xs font-medium uppercase tracking-[0.15em] text-dim">{{ col.title }}</p>
        <ul class="mt-4 space-y-2.5">
          <li *ngFor="let link of col.links">
            <a href="#" class="link-underline text-sm text-muted transition-colors hover:text-fg">{{ link }}</a>
          </li>
        </ul>
      </div>

      <div>
        <p class="font-mono text-xs font-medium uppercase tracking-[0.15em] text-dim">Newsletter</p>
        <p class="mt-3 text-sm leading-relaxed text-muted">Product updates twice a month. No spam.</p>
        <form (submit)="subscribe($event)" *ngIf="!subscribed" class="mt-4 flex flex-col gap-2.5">
          <input
            type="email"
            name="newsletter-email"
            placeholder="Email"
            required
            class="w-full rounded-lg border border-line bg-panel px-3.5 py-2.5 text-sm text-fg outline-none transition-colors placeholder:text-dim focus:border-accent/60 focus:ring-1 focus:ring-accent/30"
          />
          <button type="submit" class="btn-primary w-full px-4 py-2.5 text-sm">Subscribe</button>
        </form>
        <p *ngIf="subscribed" class="mt-4 text-sm text-accent-soft">You&rsquo;re in. First issue lands soon.</p>
      </div>
    </div>

    <div class="mt-14 flex flex-col items-center justify-between gap-4 border-t border-line-soft pt-8 sm:flex-row">
      <p class="text-[13px] text-dim">&copy; 2026 Novi</p>
      <div class="flex items-center gap-6">
        <a href="#" class="text-[13px] text-dim transition-colors hover:text-fg">Privacy</a>
        <a href="#" class="text-[13px] text-dim transition-colors hover:text-fg">Terms</a>
      </div>
    </div>
  </div>
</footer>
