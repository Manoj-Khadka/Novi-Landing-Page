<footer class="border-t border-line-soft">
  <div class="container-nv py-16">
    <div class="grid gap-12 lg:grid-cols-[1.4fr_repeat(4,1fr)]">
      <div>
        <a href="#" class="flex items-center gap-2.5">
          <span
            class="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-accent to-accent-deep font-mono text-sm font-bold text-white"
            >N</span
          >
          <span class="text-[17px] font-semibold tracking-tight text-fg">novi</span>
        </a>
        <p class="mt-4 max-w-xs text-sm leading-relaxed text-muted">
          The project & task management tool for teams who would rather build than juggle.
        </p>
        <div class="mt-5 flex items-center gap-2">
          <a href="#" class="grid h-9 w-9 place-items-center rounded-lg border border-line bg-panel text-muted transition-colors hover:border-white/20 hover:text-fg" aria-label="GitHub">
            <lucide-angular [name]="Github" [size]="16" [strokeWidth]="1.75" />
          </a>
          <a href="#" class="grid h-9 w-9 place-items-center rounded-lg border border-line bg-panel text-muted transition-colors hover:border-white/20 hover:text-fg" aria-label="Twitter">
            <lucide-angular [name]="Twitter" [size]="16" [strokeWidth]="1.75" />
          </a>
          <a href="#" class="grid h-9 w-9 place-items-center rounded-lg border border-line bg-panel text-muted transition-colors hover:border-white/20 hover:text-fg" aria-label="LinkedIn">
            <lucide-angular [name]="Linkedin" [size]="16" [strokeWidth]="1.75" />
          </a>
        </div>
      </div>

      <div *ngFor="let col of columns">
        <p class="font-mono text-xs font-medium uppercase tracking-[0.15em] text-dim">{{ col.title }}</p>
        <ul class="mt-4 space-y-2.5">
          <li *ngFor="let link of col.links">
            <a href="#" class="text-sm text-muted transition-colors hover:text-fg">{{ link }}</a>
          </li>
        </ul>
      </div>
    </div>

    <div class="mt-14 flex flex-col items-center justify-between gap-4 border-t border-line-soft pt-8 sm:flex-row">
      <p class="text-[13px] text-dim">&copy; 2026 NOVI Inc. All rights reserved.</p>
      <p class="font-mono text-[12px] text-dim">Less context switching. Everything in one place.</p>
    </div>
  </div>
</footer>
