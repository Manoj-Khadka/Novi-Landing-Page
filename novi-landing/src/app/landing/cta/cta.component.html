<section class="relative py-24 md:py-32">
  <div class="container-nv">
    <div class="reveal relative overflow-hidden rounded-[28px] border border-line bg-gradient-to-br from-accent/[0.16] via-panel to-accent-cyan/10 px-8 py-16 text-center md:py-20">
      <div class="grid-bg pointer-events-none absolute inset-0 opacity-40"></div>
      <div class="pointer-events-none absolute left-1/2 top-[-80px] h-64 w-[480px] -translate-x-1/2 rounded-full bg-accent/25 blur-[90px]"></div>

      <div class="relative">
        <h2 class="mx-auto max-w-2xl text-4xl font-bold tracking-[-0.02em] text-fg md:text-5xl">
          Stop switching. <span class="text-gradient">Start shipping.</span>
        </h2>
        <p class="mx-auto mt-5 max-w-xl text-lg text-muted">
          Bring your projects, tasks, docs and schedule to one place — and feel the difference in a
          day.
        </p>
        <div class="mt-9 flex flex-col items-center justify-center gap-3 sm:flex-row">
          <a href="#pricing" class="btn-primary px-8 py-3.5 text-[15px]">
            Get started free
            <lucide-angular [name]="ArrowRight" [size]="16" [strokeWidth]="2" />
          </a>
          <a href="#" class="btn-ghost px-8 py-3.5 text-[15px]">Talk to sales</a>
        </div>
        <p class="mt-6 text-[13px] text-dim">Free for teams up to 10 · No credit card · 2-minute setup</p>
      </div>
    </div>
  </div>
</section>
